<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Financia — Login">
    <title>Financia — Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0e1a;
            --card: rgba(20, 27, 45, 0.85);
            --border: rgba(255, 255, 255, 0.06);
            --text: #e2e8f0;
            --text-dim: #8892a4;
            --accent: #00e09e;
            --accent-glow: rgba(0, 224, 158, 0.25);
            --danger: #ff5a7e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(0, 224, 158, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            animation: bgDrift 20s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes bgDrift {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(-5%, 3%) rotate(3deg);
            }
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            backdrop-filter: blur(20px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: cardIn 0.6s ease-out;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .app-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #00bcd4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 36px;
            font-weight: 300;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        .password-input {
            width: 100%;
            padding: 16px 20px;
            padding-right: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .password-input::placeholder {
            color: var(--text-dim);
            font-weight: 300;
        }

        .password-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: var(--text);
        }

        .toggle-pw svg {
            width: 20px;
            height: 20px;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent), #00bcd4);
            border: none;
            border-radius: 14px;
            color: #0a0e1a;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s, opacity 0.2s;
            letter-spacing: 0.3px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 16px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error-msg.visible {
            opacity: 1;
        }

        /* Shake animation on error */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            50%,
            90% {
                transform: translateX(-6px);
            }

            30%,
            70% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        .lock-icon {
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .lock-icon svg {
            width: 48px;
            height: 48px;
            stroke: var(--accent);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card" id="login-card">
            <div class="lock-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    <circle cx="12" cy="16.5" r="1.5" />
                </svg>
            </div>
            <div class="logo">
                <div class="logo-icon"><svg viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="18" stroke="url(#lg)" stroke-width="2.5" />
                        <path d="M15 25c1-5 9-5 10 0M14 17c0-3 3-6 6-6s6 3 6 6" stroke="url(#lg)" stroke-width="2"
                            stroke-linecap="round" />
                        <defs>
                            <linearGradient id="lg" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#00e09e" />
                                <stop offset="1" stop-color="#00bcd4" />
                            </linearGradient>
                        </defs>
                    </svg></div>
                <h1 class="app-title">Financia</h1>
            </div>
            <p class="login-subtitle">Enter your password to continue</p>

            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <input type="password" class="password-input" id="password" placeholder="Password" autofocus>
                    <button type="button" class="toggle-pw" id="toggle-pw" tabindex="-1">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" id="eye-icon">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <button type="submit" class="login-btn" id="login-btn">Unlock Dashboard</button>
            </form>
            <p class="error-msg" id="error-msg">Incorrect password. Try again.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const pwInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const card = document.getElementById('login-card');
        const btn = document.getElementById('login-btn');
        const togglePw = document.getElementById('toggle-pw');

        togglePw.addEventListener('click', () => {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Unlocking...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwInput.value })
                });

                if (res.ok) {
                    btn.textContent = '✓ Welcome!';
                    setTimeout(() => { window.location.href = '/'; }, 400);
                } else {
                    errorMsg.classList.add('visible');
                    card.classList.remove('shake');
                    void card.offsetWidth;
                    card.classList.add('shake');
                    pwInput.value = '';
                    pwInput.focus();
                    btn.disabled = false;
                    btn.textContent = 'Unlock Dashboard';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Is the server running?';
                errorMsg.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Unlock Dashboard';
            }
        });
    </script>
</body>

</html>
